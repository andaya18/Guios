<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GUIOS PRO</title></head>
<body style="margin:0;padding:0;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif;color:#27272a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f6f6;padding:32px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:16px;">
      <tr><td style="padding:28px 32px 8px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="width:32px;height:32px;border-radius:16px;background:#fb7a35;"></td>
          <td style="padding-left:10px;font-size:16px;font-weight:bold;color:#18181b;">GUIOS PRO</td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:16px 32px 0;font-size:15px;line-height:1.6;color:#3f3f46;">
        {% for paragraph in paragraphs %}<p style="margin:0 0 14px;">{{ paragraph|linebreaksbr }}</p>{% endfor %}
      </td></tr>
      <tr><td align="center" style="padding:8px 32px 24px;">
        <div style="display:inline-block;padding:14px 28px;border-radius:12px;background:#fff1e8;color:#c2410c;font-size:30px;font-weight:bold;letter-spacing:8px;">{{ code }}</div>
        <p style="margin:10px 0 0;font-size:12px;color:#71717a;">Este código vence en {{ minutes }} minutos.</p>
      </td></tr>
      <tr><td style="padding:16px 32px 28px;border-top:1px solid #e4e4e7;font-size:12px;line-height:1.5;color:#a1a1aa;">
        Evaluación de software con la guía GUIOS. Este correo se envió automáticamente; no respondas a este mensaje.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
