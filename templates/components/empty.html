<div class="empty">
    <span class="empty__icon" aria-hidden="true">{% include "components/icon.html" with name=icon|default:"inbox" %}</span>
    <p class="empty__title">{{ title }}</p>
    {% if text %}<p class="empty__text">{{ text }}</p>{% endif %}
    {% if action_url %}<a class="button button--primary" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
</div>
