<div class="field{% if field.errors %} field--invalid{% endif %}{% if hinted %} field--hinted{% endif %}">
    <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="field__control">
        {{ field }}
        {% if icon %}{% include "components/icon.html" with name=icon %}{% endif %}
    </div>
    {% if field.help_text and not hide_help %}<span class="field__help">{{ field.help_text }}</span>{% endif %}
    {{ field.errors }}
</div>
