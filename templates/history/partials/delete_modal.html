<div class="modal" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title" hidden>
    <form class="modal__dialog modal__dialog--start" method="post" data-delete-form>
        {% csrf_token %}
        <h2 class="modal__title" id="delete-title">¿Eliminar evaluación?</h2>
        <p class="modal__text">Se eliminará el borrador «<span data-delete-label></span>» con todas sus respuestas.</p>
        <div class="alert alert--warning modal__notice">{% include "components/icon.html" with name="alert" %}<p>Esta acción no se puede deshacer. Solo se pueden eliminar borradores propios; las evaluaciones finalizadas se conservan.</p></div>
        <div class="modal__actions">
            <button class="button button--secondary" type="button" data-close-modal>Cancelar</button>
            <button class="button button--dashed" type="submit">Eliminar definitivamente</button>
        </div>
    </form>
</div>
