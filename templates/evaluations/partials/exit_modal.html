{% load ui %}<div class="modal" id="exit-modal" role="dialog" aria-modal="true" aria-labelledby="exit-title" hidden>
    <div class="modal__dialog modal__dialog--start">
        <h2 class="modal__title" id="exit-title">¿Salir de la evaluación?</h2>
        <p class="modal__text">Tu avance quedó guardado como borrador. Puedes continuar luego desde el Panel o el Historial.</p>
        <div class="alert modal__notice">{% include "components/icon.html" with name="info" %}<p>Último guardado: {{ evaluation.updated_at|saved_at }} · {{ last_saved_label }}</p></div>
        <div class="modal__actions">
            <form method="post" action="{{ delete_url }}" class="modal__actions-start">
                {% csrf_token %}
                <button class="button button--dashed" type="submit">Descartar evaluación</button>
            </form>
            <button class="button button--secondary" type="button" data-close-modal>Seguir evaluando</button>
            <a class="button button--primary" href="/">Salir</a>
        </div>
    </div>
</div>
